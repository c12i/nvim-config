# Font configuration
font-family = "Hack"
font-size = 15

# Window configuration
window-padding-x = 2
window-padding-y = 2
background-opacity = 0.9
macos-non-native-fullscreen = true
macos-titlebar-style = hidden

# Disable mouse interception
mouse-reporting = false

# Send Alt/Option as a true Alt modifier instead of composing special
# characters (e.g. Option+m -> "µ"), so terminal apps that bind Alt+<key>
# (zellij, etc.) receive the modifier instead of a literal character.
macos-option-as-alt = true

# Colors - follow system appearance (Gruvbox Dark / Gruvbox Light)
theme = light:Gruvbox Light,dark:Gruvbox Dark
cursor-color = "#d79921"

# Key bindings
keybind = ctrl+shift+h=goto_split:left
keybind = ctrl+shift+j=goto_split:down
keybind = ctrl+shift+k=goto_split:up
keybind = ctrl+shift+l=goto_split:right

# blueprint, chalkboard, microchip, glass, holographic, paper, retro, xray
macos-icon="holographic"

# force ghostty to automatically copy its terminal definitions over SSH
# when switching to the sudo user
shell-integration = detect
shell-integration-features = sudo,ssh-env,ssh-terminfo
